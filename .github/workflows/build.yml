name: Build and verify distributions

on:
  push:
    tags: ['v*', '!v*-build.*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create a draft instead of publishing the release'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a verified release while its assets are being uploaded.
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      codex-version: ${{ steps.codex.outputs.codex-version }}
      codex-cache-key: ${{ steps.codex.outputs.codex-cache-key }}
      audio-version: ${{ steps.codex.outputs.audio-version }}
      audio-sha256: ${{ steps.codex.outputs.audio-sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: version
        run: node scripts/release-version.mjs
      - name: Resolve latest stable Codex and official Codex Audio once
        id: codex
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-codex-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: codex-runtime-manifest
          path: artifacts/build/codex-runtime.json
          if-no-files-found: error
          retention-days: 30

  vsix:
    name: VSIX ${{ matrix.target }} - build then check
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-2022
            regression: true
          - target: win32-arm64
            runner: windows-11-arm
            regression: false
          - target: linux-x64
            runner: ubuntu-24.04
            regression: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            regression: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      VSIX_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      VCODEX_CODEX_RUNTIME_MANIFEST: artifacts/build/codex-runtime.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/cache@v4
        with:
          path: artifacts/codex/${{ needs.version.outputs.codex-version }}/downloads/${{ matrix.target }}.tgz
          key: codex-${{ matrix.target }}-${{ needs.version.outputs.codex-version }}-${{ needs.version.outputs.codex-cache-key }}
      - uses: actions/cache@v4
        with:
          path: artifacts/codex-audio/${{ needs.version.outputs.audio-version }}/universal.vsix
          key: codex-audio-universal-${{ needs.version.outputs.audio-version }}-${{ needs.version.outputs.audio-sha256 }}
      - uses: actions/download-artifact@v4
        with:
          name: codex-runtime-manifest
          path: artifacts/build
      - run: bun install --frozen-lockfile
      - name: Build platform VSIX with independent bundled Audio
        run: node scripts/build-vsix.mjs --target ${{ matrix.target }}
      - name: Check extension and shared UI types after build
        run: bun run type-check
      - name: Check packaging and upstream contracts after build
        run: bun run test:packaging
      - name: Verify and extract exactly the packaged runtime
        run: node scripts/verify-vsix.mjs --file artifacts/v${{ needs.version.outputs.version }}/Vcodex-Chamber-${{ needs.version.outputs.version }}-${{ matrix.target }}.vsix --target ${{ matrix.target }} --extract-runtime artifacts/test/codex-runtime
      - name: Native Codex version and app-server handshake
        run: node scripts/verify-codex-runtime.mjs --directory artifacts/test/codex-runtime --target ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        if: matrix.target == 'win32-x64'
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Check capture and dictation integration after build
        if: matrix.regression
        run: bun run test
      - name: Install browser for Linux UI checks
        if: matrix.target == 'linux-x64'
        run: bunx playwright install --with-deps chromium
      - name: Check built chat, auth and teleprompter UI
        if: matrix.regression
        run: bun run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: artifacts/v${{ needs.version.outputs.version }}/Vcodex-Chamber-${{ needs.version.outputs.version }}-${{ matrix.target }}.vsix*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux-arm64'
        with:
          name: audio-linux-arm64
          path: artifacts/v${{ needs.version.outputs.version }}/Vcodex-Audio-ARM-${{ needs.version.outputs.version }}-linux-arm64.vsix*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windowssender:
    name: WindowsSender - build then check
    needs: version
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: bun install --frozen-lockfile
      - name: Publish self-contained WindowsSender (Windows only)
        shell: pwsh
        run: ./scripts/build-windowssender.ps1 -Version '${{ needs.version.outputs.version }}'
      - name: Check WindowsSender integration after build
        run: node scripts/verify-windowssender.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windowssender-win-x64
          path: artifacts/v${{ needs.version.outputs.version }}/*-win-x64.zip*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  distributions:
    needs: [version, vsix, windowssender]
    runs-on: ubuntu-24.04
    env:
      VCODEX_CODEX_RUNTIME_MANIFEST: artifacts/build/codex-runtime.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: codex-runtime-manifest
          path: artifacts/build
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: artifacts/v${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: audio-linux-arm64
          path: artifacts/v${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: windowssender-win-x64
          path: artifacts/v${{ needs.version.outputs.version }}
      - run: node scripts/package-release.mjs ${{ needs.version.outputs.version }} --collect-only
      - uses: actions/upload-artifact@v4
        with:
          name: Vcodex-Chamber-${{ needs.version.outputs.version }}
          path: |
            artifacts/v${{ needs.version.outputs.version }}/*.vsix
            artifacts/v${{ needs.version.outputs.version }}/*.zip
            artifacts/v${{ needs.version.outputs.version }}/SHA256SUMS.txt
            artifacts/v${{ needs.version.outputs.version }}/codex-runtime.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    needs: [version, distributions]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: Vcodex-Chamber-${{ needs.version.outputs.version }}
          path: release
      - name: Create release and upload all verified distributions
        run: node scripts/publish-release.mjs
